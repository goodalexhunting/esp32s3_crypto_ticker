name: PlatformIO Build

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Host-side unit + integration tests (no board required).
    # Pre-merge gate: runs on pull requests targeting staging, so only
    # PRs with a passing suite can be merged in.
    # Post-merge gate: runs on pushes to staging (release candidates) and
    # prod (production releases), blocking the build -- and therefore the
    # release -- if the suite fails. PRs targeting prod and manual
    # workflow_dispatch runs skip tests (compile-only, see build's
    # needs.result handling below).
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/prod')) ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run native unit/integration tests
        run: pio test -e native

  build:
    needs: test
    # Run the build when the test job either passed (tests ran and were
    # green) or was skipped (PRs targeting prod and manual workflow_dispatch
    # runs, which don't run tests). A failed test run blocks the build and
    # therefore the release.
    if: needs.test.result == 'success' || needs.test.result == 'skipped'
    runs-on: ubuntu-latest
    outputs:
      is_prod: ${{ steps.meta.outputs.is_prod }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # Compute the production release version only for pushes to prod.
      # MAJOR.MINOR is read from FW_VERSION in include/app_config.h
      # (user-managed, never auto-incremented). PATCH is auto-incremented
      # from the highest existing v<major>.<minor>.x tag; if no such tag
      # exists, PATCH starts at 0 (so the first 1.0.x release is 1.0.0).
      - name: Compute release metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const isProd =
              context.eventName === 'push' && context.ref === 'refs/heads/prod';
            let version = '';
            let tag = '';
            let fwFlags = '';
            if (isProd) {
              const fs = require('fs');
              const header = fs.readFileSync(
                `${process.env.GITHUB_WORKSPACE}/include/app_config.h`,
                'utf8'
              );
              const match = header.match(
                /#define\s+FW_VERSION_STR\s+(\d+)\.(\d+)\.(\d+)/
              );
              if (!match) {
                throw new Error(
                  'Could not parse FW_VERSION_STR from include/app_config.h'
                );
              }
              const majorMinor = `${match[1]}.${match[2]}`;
              const { data: refs } = await github.rest.git.listMatchingRefs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${majorMinor}.`,
              });
              let maxPatch = -1;
              for (const ref of refs) {
                const p = ref.ref.match(
                  new RegExp(`^refs/tags/v${majorMinor}\\.(\\d+)$`)
                );
                if (p) maxPatch = Math.max(maxPatch, parseInt(p[1], 10));
              }
              const patch = maxPatch + 1;
              version = `${majorMinor}.${patch}`;
              tag = `v${version}`;
              fwFlags = `-DFW_VERSION_STR=${version}`;
            }
            core.setOutput('is_prod', isProd ? '1' : '0');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('fw_flags', fwFlags);

      # The web UI is embedded in the firmware (see include/embedded_ui.h),
      # so no LittleFS filesystem image is built or uploaded any more.
      - name: Build firmware
        run: pio run -e lilygo-t-display-s3
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ steps.meta.outputs.fw_flags }}

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp .pio/build/lilygo-t-display-s3/firmware.bin dist/firmware.bin
          cp .pio/build/lilygo-t-display-s3/partitions.bin dist/partitions.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-lilygo-t-display-s3
          path: |
            dist/firmware.bin
            dist/partitions.bin
          if-no-files-found: error
          retention-days: 30

  release:
    # Production release, only for pushes to the prod branch:
    #   - deletes old non-production (nightly) releases so /releases/latest
    #     always points at a stable production release for OTA
    #   - publishes the firmware + OTA manifest as assets
    if: needs.build.outputs.is_prod == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-lilygo-t-display-s3
          path: dist

      - name: Delete legacy non-production releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const rel of releases) {
              // Keep stable production releases (tagged vX.Y.Z); delete
              // everything else (nightly/dev artefacts).
              if (/^v\d+\.\d+\.\d+$/.test(rel.tag_name)) continue;
              console.log(`Deleting release "${rel.name}" (${rel.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${rel.tag_name}`,
                });
              } catch (err) {
                console.log(`Tag ${rel.tag_name} not deleted: ${err.message}`);
              }
            }

      - name: Compute SHA-256
        id: sha256
        run: |
          echo "hash=$(sha256sum dist/firmware.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create manifest
        run: |
          cat > dist/ota_manifest.json << EOF
          {
            "version": "${{ needs.build.outputs.version }}",
            "firmware_url": "https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}/firmware.bin",
            "sha256": "${{ steps.sha256.outputs.hash }}"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Firmware ${{ needs.build.outputs.version }}
          files: |
            dist/firmware.bin
            dist/partitions.bin
            dist/ota_manifest.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  pages:
    # Deploy the GitHub Pages landing page (site/) on pushes to prod.
    # Repository setting: Settings > Pages > Source = "GitHub Actions".
    if: needs.build.outputs.is_prod == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4