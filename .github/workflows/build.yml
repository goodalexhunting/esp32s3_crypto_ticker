name: PlatformIO Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e lilygo-t-display-s3

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-lilygo-t-display-s3
          path: |
            .pio/build/lilygo-t-display-s3/firmware.bin
            .pio/build/lilygo-t-display-s3/partitions.bin
          if-no-files-found: error
          retention-days: 30

  release:
    # Publish a GitHub Release with the firmware + manifest:
    #   - every push to main  -> nightly release, version = FW_VERSION
    #   - vX.Y.Z tag push     -> versioned release, version = tag
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-lilygo-t-display-s3
          path: dist

      - name: Compute SHA-256
        id: sha256
        run: |
          echo "hash=$(sha256sum dist/firmware.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Determine release metadata
        id: meta
        run: |
          # Single authoritative version, from include/app_config.h.
          FW_VERSION="$(sed -n 's/.*FW_VERSION\[\] = "\([0-9][0-9.]*\)".*/\1/p' include/app_config.h)"
          if [[ -z "${FW_VERSION}" ]]; then
            echo "::error::Could not parse FW_VERSION from include/app_config.h"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Versioned release: strip refs/tags/ and the leading 'v' so the
            # manifest version is a plain X.Y.Z the device can compare.
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            SUFFIX=""
            # Guard against the OTA re-install loop: tag must match FW_VERSION.
            if [[ "${VERSION}" != "${FW_VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match FW_VERSION=${FW_VERSION} in include/app_config.h. Bump FW_VERSION first."
              exit 1
            fi
          else
            # Push to main: nightly release versioned by FW_VERSION so the
            # device never sees a persistently newer version and re-installs.
            VERSION="${FW_VERSION}"
            RELEASE_TAG="nightly-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
            SUFFIX=" (nightly ${GITHUB_SHA::7})"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Create manifest
        run: |
          cat > dist/ota_manifest.json << EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "firmware_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/firmware.bin",
            "sha256": "${{ steps.sha256.outputs.hash }}"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Firmware ${{ steps.meta.outputs.version }}${{ steps.meta.outputs.suffix }}
          files: |
            dist/firmware.bin
            dist/partitions.bin
            dist/ota_manifest.json
          draft: false
          prerelease: false