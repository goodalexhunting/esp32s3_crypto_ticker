; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

; Custom partition table with OTA support (two app slots).
; This is required for the OTA firmware update mechanism.
board_build.partitions = partitions.csv

lib_deps =
  bblanchon/ArduinoJson
  lovyan03/LovyanGFX
  ricmoo/QRCode
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP

upload_speed = 115200
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Host-side unit/integration tests (run on the dev machine and CI, no board).
;   pio test -e native
;
; Each test/test_<name>/test_<name>.cpp is a standalone binary. The mocks in
; test/mocks shadow <Arduino.h>, <WiFi.h>, <WebServer.h>, <DNSServer.h>,
; <Preferences.h> and <HTTPClient.h> so the pure-logic and state-machine code
; can be exercised without hardware. The source files under test are included
; directly by the test .cpp (build_src_filter excludes src/ so nothing else
; from the firmware links in).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_deps =
  bblanchon/ArduinoJson
build_flags =
  -Itest/mocks
  -Iinclude
  -std=gnu++11
